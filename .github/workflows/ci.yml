name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test --summary all
      # O que chama a SDL e o ImGui (os testes não chamam): compila sem ligar nada, com os
      # headers da SDL3 baixados (o Ubuntu do CI não tem a SDL3).
      - run: tools/deps.sh
      - run: zig build check -Dsdl-include=.deps/windows/include
      # Os componentes num ImGui de verdade, sem janela.
      - run: zig build test-ui -Dsdl-include=.deps/windows/include --summary all

  # Os testes saem do Linux para Windows (x86_64-windows-gnu) e rodam num Windows de verdade.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/deps.sh
      - run: zig build check -Dtarget=x86_64-windows-gnu
      - run: zig build test-bin test-ui-bin -Dtarget=x86_64-windows-gnu -p out
      # A vitrine (examples/vitrine) compila para Windows.
      - run: zig build vitrine -Dtarget=x86_64-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: out/bin/

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
          path: bin
      - run: bin\larperkit-test.exe
      - run: bin\larperkit-test-ui.exe
